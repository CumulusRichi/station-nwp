<style>
:root{--azul:#17366d;--azul-oscuro:#10254d;--amarillo:#f4c430;--fondo:#f5f7fa;--borde:#d8dee8;--texto:#263238}
*{box-sizing:border-box}

.contenedor{width:96%;max-width:1500px;margin:20px auto}

.leyenda-linea{display:inline-block;width:27px;height:3px;flex:0 0 27px}
.leyenda-observado{display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:14px;padding-top:11px;border-top:1px solid #e1e6ec;font-size:11px;font-weight:700;color:#111}

.leaflet-popup-content{font-family:Arial,Helvetica,sans-serif;line-height:1.4}
.leaflet-popup-content strong{color:var(--azul-oscuro)}
#hoverPersonalizado{display:none;position:fixed;z-index:9999;min-width:190px;max-width:250px;max-height:calc(100vh - 20px);overflow-y:auto;background:rgba(255,255,255,.97);border:1px solid #aeb9c8;box-shadow:0 2px 8px rgba(0,0,0,.14);padding:7px 9px;font-size:9px;line-height:1.25;color:#263238;pointer-events:none}
.hover-fecha{font-size:9px;font-weight:700;color:#10254d;border-bottom:1px solid #d8dee8;padding-bottom:4px;margin-bottom:4px}
.hover-grupo{margin-top:5px}

<body>
<div class="contenedor">
<div class="cabecera">
<h1>Verificación de Pronósticos de Modelos Numéricos</h1>
<p>Plataforma para la comparación y evaluación de pronósticos de temperatura y precipitación frente a observaciones de estaciones meteorológicas.</p>

<script>
const MODELOS={
gfs:{nombre:"GFS",colores:["#bbdefb","#90caf9","#64b5f6","#42a5f5","#2196f3","#1976d2","#1565c0","#0d47a1"]},
ecmwf:{nombre:"ECMWF",colores:["#ffcdd2","#ef9a9a","#e57373","#ef5350","#f44336","#e53935","#d32f2f","#b71c1c"]},
eta5:{nombre:"ETA5",colores:["#c8e6c9","#a5d6a7","#81c784","#66bb6a","#4caf50","#43a047","#388e3c","#1b5e20"]},
wrf5:{nombre:"WRF5",colores:["#ffe0b2","#ffcc80","#ffb74d","#ffa726","#ff9800","#fb8c00","#ef6c00","#e65100"]},
mpas15:{nombre:"MPAS15",colores:["#e1bee7","#ce93d8","#ba68c8","#ab47bc","#9c27b0","#8e24aa","#7b1fa2","#4a148c"]}
};
const ORDEN_MODELOS=["gfs","ecmwf","eta5","wrf5","mpas15"];
let manifiesto=null;
let estaciones=[];
let cacheCSV={};
let mapa=null;
let capaEstaciones=null;
let marcadores={};

async function cargarCSV(ruta){
if(cacheCSV[ruta]) return cacheCSV[ruta];
const respuesta=await fetch(ruta,{cache:"no-cache"});
if(!respuesta.ok) throw new Error(`No se pudo cargar ${ruta}`);
const texto=await respuesta.text();
const resultado=Papa.parse(texto,{header:true,dynamicTyping:false,skipEmptyLines:true});
cacheCSV[ruta]=resultado.data;
return resultado.data;
}

function timestampUTC(cadena){
const y=cadena.slice(0,4),m=cadena.slice(4,6),d=cadena.slice(6,8),h=cadena.slice(8,10);
return new Date(`${y}-${m}-${d}T${h}:00:00Z`);
}

function fechaPeru(cadena){
const fecha=timestampUTC(cadena);
const partes=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Lima",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(fecha);
const datos={};
for(const p of partes) datos[p.type]=p.value;
return `${datos.year}-${datos.month}-${datos.day}T${datos.hour}:${datos.minute}:00`;
}

async function cargarEstaciones(){
const [metadata,obsTemp,obsPP]=await Promise.all([
cargarCSV("observaciones/metadata.csv"),
cargarCSV("observaciones/obs_temp.csv"),
cargarCSV("observaciones/obs_pp.csv")
]);
const codigosDisponibles=new Set([...obsTemp.map(f=>String(f.codigo)),...obsPP.map(f=>String(f.codigo))]);
estaciones=metadata.filter(f=>codigosDisponibles.has(String(f.codigo))).map(f=>({
codigo:String(f.codigo),estacion:f.estacion,departamento:f.departamento,provincia:f.provincia,
latitud:parseFloat(f.latitud),longitud:parseFloat(f.longitud)
})).filter(e=>Number.isFinite(e.latitud)&&Number.isFinite(e.longitud));
estaciones.sort((a,b)=>a.estacion.localeCompare(b.estacion,"es"));
cargarDepartamentos();
}

function agregarOpcionVacia(select,texto){
const option=document.createElement("option");
option.value="";
option.textContent=texto;
select.appendChild(option);
}

function cargarDepartamentos(){
const select=document.getElementById("departamentoSelect");
const departamentos=[...new Set(estaciones.map(e=>e.departamento).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
select.innerHTML="";
agregarOpcionVacia(select,"Seleccione departamento");
for(const departamento of departamentos){
const option=document.createElement("option");
option.value=departamento;
option.textContent=departamento;
select.appendChild(option);
}
cargarProvincias();
}

function cargarProvincias(){
const departamento=document.getElementById("departamentoSelect").value;
const select=document.getElementById("provinciaSelect");
select.innerHTML="";
agregarOpcionVacia(select,"Seleccione provincia");
if(departamento){
const provincias=[...new Set(estaciones.filter(e=>e.departamento===departamento).map(e=>e.provincia).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
for(const provincia of provincias){
const option=document.createElement("option");
option.value=provincia;
option.textContent=provincia;
select.appendChild(option);
}
}
cargarEstacionesProvincia();
}

function cargarEstacionesProvincia(){
const departamento=document.getElementById("departamentoSelect").value;
const provincia=document.getElementById("provinciaSelect").value;
const select=document.getElementById("estacionSelect");
select.innerHTML="";
agregarOpcionVacia(select,"Seleccione estación");
if(!departamento||!provincia) return;
const filtradas=estaciones.filter(e=>e.departamento===departamento&&e.provincia===provincia);
for(const estacion of filtradas){
const option=document.createElement("option");
option.value=estacion.codigo;
option.textContent=`${estacion.estacion} (${estacion.codigo})`;
select.appendChild(option);
}
}

function iniciarMapa(){
mapa=L.map("mapa",{zoomControl:true}).setView([-9.2,-75.0],5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"&copy; OpenStreetMap"}).addTo(mapa);
capaEstaciones=L.layerGroup().addTo(mapa);
}

function estiloMarcador(seleccionado=false){
return{radius:seleccionado?9:6,color:"#17366d",weight:seleccionado?3:2,fillColor:seleccionado?"#f4c430":"#ffffff",fillOpacity:seleccionado?1:.9};
}

function actualizarMapa(){
if(!mapa) return;
const departamento=document.getElementById("departamentoSelect").value;
const provincia=document.getElementById("provinciaSelect").value;
const codigo=document.getElementById("estacionSelect").value;
let filtradas=estaciones;
if(departamento) filtradas=filtradas.filter(e=>e.departamento===departamento);
if(provincia) filtradas=filtradas.filter(e=>e.provincia===provincia);
capaEstaciones.clearLayers();
marcadores={};
const limites=[];
for(const estacion of filtradas){
const marcador=L.circleMarker([estacion.latitud,estacion.longitud],estiloMarcador(estacion.codigo===codigo));
marcador.bindTooltip(`${estacion.estacion} (${estacion.codigo})`,{direction:"top"});
marcador.bindPopup(`<strong>${estacion.estacion}</strong><br>${estacion.provincia}, ${estacion.departamento}<br>Código: ${estacion.codigo}`);
marcador.on("click",async()=>{await seleccionarEstacionDesdeMapa(estacion)});
marcador.addTo(capaEstaciones);
marcadores[estacion.codigo]=marcador;
limites.push([estacion.latitud,estacion.longitud]);
}
if(limites.length===1) mapa.setView(limites[0],11);
else if(limites.length>1) mapa.fitBounds(limites,{padding:[30,30],maxZoom:11});
resaltarEstacion(codigo,false);
}

function resaltarEstacion(codigo,centrar=true){
for(const [id,marcador] of Object.entries(marcadores)){
marcador.setStyle(estiloMarcador(id===codigo));
if(id===codigo){
marcador.bringToFront();
if(centrar) mapa.panTo(marcador.getLatLng());
}
}
}

async function seleccionarEstacionDesdeMapa(estacion){
document.getElementById("departamentoSelect").value=estacion.departamento;
cargarProvincias();
document.getElementById("provinciaSelect").value=estacion.provincia;
cargarEstacionesProvincia();
document.getElementById("estacionSelect").value=estacion.codigo;
actualizarMapa();
resaltarEstacion(estacion.codigo,true);
await actualizarGraficas();
}

async function cargarManifiesto(){
const respuesta=await fetch("modelos/ciclos.json",{cache:"no-cache"});
if(!respuesta.ok) throw new Error("No se pudo cargar modelos/ciclos.json");
manifiesto=await respuesta.json();
}

function modelosSeleccionados(){
const seleccionados=[];
document.querySelectorAll(".modelo-input").forEach(input=>{if(input.checked) seleccionados.push(input.value)});
return seleccionados;
}

function obtenerFila(datos,codigo){
return datos.find(fila=>String(fila.codigo)===String(codigo));
}

function filaASerie(fila){
if(!fila) return{x:[],y:[]};
const columnas=Object.keys(fila).filter(col=>/^\d{10}$/.test(col)).sort();
const x=[],y=[];
for(const columna of columnas){
const valor=parseFloat(fila[columna]);
if(fila[columna]===""||fila[columna]===null||fila[columna]===undefined||Number.isNaN(valor)) y.push(null);
else y.push(valor);
x.push(fechaPeru(columna));
}
return{x,y};
}

async function crearTrazaObservada(variable,codigo){
const ruta=variable==="temp"?"observaciones/obs_temp.csv":"observaciones/obs_pp.csv";
const datos=await cargarCSV(ruta);
const fila=obtenerFila(datos,codigo);
const serie=filaASerie(fila);
return{
x:serie.x,y:serie.y,type:"scatter",mode:variable==="pp"?"lines+markers":"lines",name:"OBSERVADO",
line:{color:"#111111",width:3},marker:{color:"#111111",size:4},connectgaps:false,
hoverinfo:"none",showlegend:false,meta:{tipo:"observado",variable:variable}
};
}

async function crearTrazasUnModelo(variable,codigo,modelo,ciclos){
const ciclosModelo=ciclos.filter(ciclo=>{
const info=manifiesto.ciclos[ciclo];
return info[modelo]&&info[modelo].includes(variable);
});
const trazas=[];
for(let i=0;i<ciclosModelo.length;i++){
const ciclo=ciclosModelo[i];
const hora=ciclo.slice(8,10);
const archivo=`modelos/${ciclo}/${modelo}_${hora}_${variable}.csv`;
let datos;
try{datos=await cargarCSV(archivo)}catch(error){console.warn(error);continue}
const fila=obtenerFila(datos,codigo);
if(!fila) continue;
const serie=filaASerie(fila);
const colores=MODELOS[modelo].colores;
const indiceColor=ciclosModelo.length===1?colores.length-2:Math.round(i*(colores.length-1)/(ciclosModelo.length-1));
const dia=ciclo.slice(6,8);
const mes=ciclo.slice(4,6);
trazas.push({
x:serie.x,y:serie.y,type:"scatter",mode:variable==="pp"?"lines+markers":"lines",
name:`${dia}/${mes} ${hora}Z`,line:{color:colores[indiceColor],width:1.5},
marker:{color:colores[indiceColor],size:3},connectgaps:false,hoverinfo:"none",showlegend:false,
meta:{tipo:"modelo",modelo:modelo,nombreModelo:MODELOS[modelo].nombre,ciclo:ciclo,etiqueta:`${dia}/${mes} ${hora}Z`,color:colores[indiceColor],variable:variable}
});
}
return trazas;
}

async function crearTrazasModelos(variable,codigo){
const activos=modelosSeleccionados();
const ciclos=Object.keys(manifiesto.ciclos).sort();
const grupos=await Promise.all(activos.map(modelo=>crearTrazasUnModelo(variable,codigo,modelo,ciclos)));
return grupos.flat();
}

function crearLeyendaPersonalizada(idContenedor,trazasModelos){
const contenedor=document.getElementById(idContenedor);
const activos=modelosSeleccionados();
let html=`<div class="leyenda-pronosticos"><div class="leyenda-titulo">INICIALIZACIÓN DEL PRONÓSTICO</div><div class="leyenda-modelos">`;
for(const modelo of activos){
const trazas=trazasModelos.filter(t=>t.meta&&t.meta.modelo===modelo);
html+=`<div class="leyenda-modelo"><div class="leyenda-modelo-titulo">${MODELOS[modelo].nombre}</div>`;
if(trazas.length===0) html+=`<div class="leyenda-ciclo">Sin datos</div>`;
else{
for(const traza of trazas){
html+=`<div class="leyenda-ciclo"><span class="leyenda-linea" style="background:${traza.meta.color}"></span><span>${traza.meta.etiqueta}</span></div>`;
}
}
html+=`</div>`;
}
html+=`</div><div class="leyenda-observado">OBSERVADO<span class="leyenda-observado-linea"></span></div></div>`;
contenedor.innerHTML=html;
}

function fechasValidas(traza){
const fechas=[];
for(let i=0;i<traza.x.length;i++){
if(traza.y[i]!==null&&traza.y[i]!==undefined&&!Number.isNaN(traza.y[i])) fechas.push(traza.x[i]);
}
return fechas;
}

function rangoTemporal(trazaObs,trazasModelos){
const obs=fechasValidas(trazaObs);
const todas=[trazaObs,...trazasModelos].flatMap(fechasValidas);
if(todas.length===0) return null;
todas.sort();
return[obs.length>0?obs[0]:todas[0],todas[todas.length-1]];
}

function crearLayout(titulo,unidad,rango){
const xaxis={
title:{text:"Fecha"},type:"date",tickformat:"%d/%m",hoverformat:"%d/%m/%Y %H:%M",
showgrid:true,gridcolor:"#edf0f4",linecolor:"#8492a6",zeroline:false,
showspikes:true,spikemode:"across",spikesnap:"cursor",spikedash:"dot",spikecolor:"#90a4ae",
rangeslider:{visible:false}
};
if(rango){
xaxis.range=rango;
xaxis.minallowed=rango[0];
xaxis.maxallowed=rango[1];
}
return{
title:{text:titulo,x:.5,xanchor:"center",font:{size:17,color:"#10254d"}},
margin:{l:70,r:30,t:70,b:75},
paper_bgcolor:"white",plot_bgcolor:"white",
font:{family:"Arial, Helvetica, sans-serif",color:"#263238"},
hovermode:"x",hoverdistance:80,spikedistance:-1,
xaxis:xaxis,
yaxis:{title:{text:unidad},showgrid:true,gridcolor:"#e4e8ed",linecolor:"#8492a6",zeroline:false},
showlegend:false
};
}

const CONFIG_PLOTLY={responsive:true,displaylogo:false,scrollZoom:true};

function formatearFechaHover(valor){
const fecha=new Date(valor);
if(Number.isNaN(fecha.getTime())) return "";
const dia=String(fecha.getDate()).padStart(2,"0");
const mes=String(fecha.getMonth()+1).padStart(2,"0");
const hora=String(fecha.getHours()).padStart(2,"0");
const minuto=String(fecha.getMinutes()).padStart(2,"0");
return `${dia}/${mes} ${hora}:${minuto}`;
}

function unidadVariable(variable){
return variable==="temp"?"°C":"mm";
}

function mostrarHoverPersonalizado(data,event){
const tooltip=document.getElementById("hoverPersonalizado");
if(!data||!data.points||data.points.length===0) return;
const puntos=data.points.filter(p=>p.y!==null&&p.y!==undefined&&!Number.isNaN(Number(p.y)));
if(puntos.length===0){ocultarHoverPersonalizado();return}
const grupos={};
let observado=null;
for(const punto of puntos){
const meta=punto.data.meta||{};
if(meta.tipo==="observado"){
observado=punto;
continue;
}
if(meta.tipo==="modelo"&&meta.modelo){
if(!grupos[meta.modelo]) grupos[meta.modelo]=[];
grupos[meta.modelo].push(punto);
}
}
const fecha=formatearFechaHover(puntos[0].x);
let html=`<div class="hover-fecha">Hora local: ${fecha}</div>`;
for(const modelo of ORDEN_MODELOS){
if(!grupos[modelo]) continue;
grupos[modelo].sort((a,b)=>(a.data.meta.ciclo||"").localeCompare(b.data.meta.ciclo||""));
html+=`<div class="hover-grupo"><div class="hover-modelo">${MODELOS[modelo].nombre}</div>`;
for(const punto of grupos[modelo]){
const meta=punto.data.meta;
const valor=Number(punto.y);
html+=`<div class="hover-fila"><span class="hover-linea" style="background:${meta.color}"></span><span>${meta.etiqueta} (${valor.toFixed(1)} ${unidadVariable(meta.variable)})</span></div>`;
}
html+=`</div>`;
}
if(observado){
const meta=observado.data.meta||{};
const valor=Number(observado.y);
html+=`<div class="hover-observado"><div class="hover-modelo">OBSERVADO</div><div class="hover-fila"><span class="hover-linea" style="background:#111"></span><span>${valor.toFixed(1)} ${unidadVariable(meta.variable)}</span></div></div>`;
}
tooltip.innerHTML=html;
tooltip.style.display="block";
posicionarHover(event);
}

function posicionarHover(event){
const tooltip=document.getElementById("hoverPersonalizado");
const margen=10;
let x=event.clientX+15;
let y=event.clientY+15;
const rect=tooltip.getBoundingClientRect();
if(x+rect.width>window.innerWidth-margen) x=event.clientX-rect.width-15;
if(y+rect.height>window.innerHeight-margen) y=window.innerHeight-rect.height-margen;
if(y<margen) y=margen;
if(x<margen) x=margen;
tooltip.style.left=`${x}px`;
tooltip.style.top=`${y}px`;
}

function ocultarHoverPersonalizado(){
document.getElementById("hoverPersonalizado").style.display="none";
}

function activarHoverPersonalizado(idGrafica){
const grafica=document.getElementById(idGrafica);
grafica.removeAllListeners("plotly_hover");
grafica.removeAllListeners("plotly_unhover");
grafica.on("plotly_hover",data=>{
const evento=data.event||window.event;
if(evento) mostrarHoverPersonalizado(data,evento);
});
grafica.on("plotly_unhover",ocultarHoverPersonalizado);
}

function mostrarSinEstacion(){
document.getElementById("informacion").textContent="Seleccione una estación en el mapa o mediante los filtros para visualizar los pronósticos y observaciones.";
ocultarHoverPersonalizado();
Plotly.purge("graficaTemperatura");
Plotly.purge("graficaPrecipitacion");
document.getElementById("graficaTemperatura").innerHTML='<div class="mensaje-grafica">Seleccione una estación para visualizar la temperatura.</div>';
document.getElementById("graficaPrecipitacion").innerHTML='<div class="mensaje-grafica">Seleccione una estación para visualizar la precipitación.</div>';
document.getElementById("leyendaTemperatura").innerHTML="";
document.getElementById("leyendaPrecipitacion").innerHTML="";
}

async function actualizarGraficas(){
const codigo=document.getElementById("estacionSelect").value;
if(!codigo){mostrarSinEstacion();return}
const estacion=estaciones.find(e=>String(e.codigo)===String(codigo));
if(!estacion) return;
document.getElementById("informacion").textContent=`${estacion.estacion} (${estacion.codigo}) | ${estacion.provincia}, ${estacion.departamento} | Hora mostrada: Perú (UTC-5) | Pase el cursor sobre la gráfica para comparar los pronósticos disponibles`;
try{
const [obsTemp,modelosTemp,obsPP,modelosPP]=await Promise.all([
crearTrazaObservada("temp",codigo),
crearTrazasModelos("temp",codigo),
crearTrazaObservada("pp",codigo),
crearTrazasModelos("pp",codigo)
]);
const rangoTemp=rangoTemporal(obsTemp,modelosTemp);
const rangoPP=rangoTemporal(obsPP,modelosPP);
const layoutTemp=crearLayout("Temperatura del aire a 2 m","Temperatura (°C)",rangoTemp);
const layoutPP=crearLayout("Precipitación acumulada cada 6 horas","Precipitación (mm / 6 h)",rangoPP);
layoutPP.yaxis.rangemode="tozero";

ocultarHoverPersonalizado();
Plotly.purge("graficaTemperatura");
Plotly.purge("graficaPrecipitacion");
document.getElementById("graficaTemperatura").innerHTML="";
document.getElementById("graficaPrecipitacion").innerHTML="";

await Promise.all([
Plotly.newPlot("graficaTemperatura",[...modelosTemp,obsTemp],layoutTemp,CONFIG_PLOTLY),
Plotly.newPlot("graficaPrecipitacion",[...modelosPP,obsPP],layoutPP,CONFIG_PLOTLY)
]);

crearLeyendaPersonalizada("leyendaTemperatura",modelosTemp);
crearLeyendaPersonalizada("leyendaPrecipitacion",modelosPP);
activarHoverPersonalizado("graficaTemperatura");
activarHoverPersonalizado("graficaPrecipitacion");
}catch(error){
console.error(error);
document.getElementById("informacion").textContent=`Error cargando datos: ${error.message}`;
}
}

document.getElementById("departamentoSelect").addEventListener("change",async()=>{
cargarProvincias();
actualizarMapa();
await actualizarGraficas();
});

document.getElementById("provinciaSelect").addEventListener("change",async()=>{
cargarEstacionesProvincia();
actualizarMapa();
await actualizarGraficas();
});

document.getElementById("estacionSelect").addEventListener("change",async()=>{
const codigo=document.getElementById("estacionSelect").value;
if(codigo) resaltarEstacion(codigo,true);
else actualizarMapa();
await actualizarGraficas();
});

document.querySelectorAll(".modelo-input").forEach(input=>{
input.addEventListener("change",actualizarGraficas);
});

window.addEventListener("scroll",ocultarHoverPersonalizado,{passive:true});
window.addEventListener("resize",ocultarHoverPersonalizado);

async function iniciar(){
try{
iniciarMapa();
await Promise.all([cargarManifiesto(),cargarEstaciones()]);
actualizarMapa();
await actualizarGraficas();
setTimeout(()=>mapa.invalidateSize(),100);
}catch(error){
console.error(error);
document.getElementById("informacion").textContent="Error cargando datos: "+error.message;
}
}

iniciar();
</script>
