<script>

const MODELOS = {
    gfs:{
        nombre:"GFS",
        colores:["#bbdefb","#90caf9","#64b5f6","#42a5f5","#2196f3","#1976d2","#1565c0","#0d47a1"]
    },

    ecmwf:{
        nombre:"ECMWF",
        colores:["#ffcdd2","#ef9a9a","#e57373","#ef5350","#f44336","#e53935","#d32f2f","#b71c1c"]
    },

    eta5:{
        nombre:"ETA5",
        colores:["#c8e6c9","#a5d6a7","#81c784","#66bb6a","#4caf50","#43a047","#388e3c","#1b5e20"]
    },

    wrf5:{
        nombre:"WRF5",
        colores:["#ffe0b2","#ffcc80","#ffb74d","#ffa726","#ff9800","#fb8c00","#ef6c00","#e65100"]
    },

    mpas15:{
        nombre:"MPAS15",
        colores:["#e1bee7","#ce93d8","#ba68c8","#ab47bc","#9c27b0","#8e24aa","#7b1fa2","#4a148c"]
    }
};

let manifiesto=null;
let estaciones=[];
let cacheCSV={};

let mapa=null;
let capaEstaciones=null;
let marcadores={};


/* =========================================================
   CSV
========================================================= */

async function cargarCSV(ruta) {

    if(cacheCSV[ruta])
        return cacheCSV[ruta];

    const respuesta=await fetch(ruta,{cache:"no-cache"});

    if(!respuesta.ok)
        throw new Error(`No se pudo cargar ${ruta}`);

    const texto=await respuesta.text();

    const resultado=Papa.parse(texto,{
        header:true,
        dynamicTyping:false,
        skipEmptyLines:true
    });

    cacheCSV[ruta]=resultado.data;

    return resultado.data;
}


/* =========================================================
   FECHAS
========================================================= */

function timestampUTC(cadena) {

    const y=cadena.slice(0,4);
    const m=cadena.slice(4,6);
    const d=cadena.slice(6,8);
    const h=cadena.slice(8,10);

    return new Date(`${y}-${m}-${d}T${h}:00:00Z`);
}


function fechaPeru(cadena) {

    const fecha=timestampUTC(cadena);

    const partes=new Intl.DateTimeFormat("en-CA",{
        timeZone:"America/Lima",
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        hourCycle:"h23"
    }).formatToParts(fecha);

    const datos={};

    for(const p of partes)
        datos[p.type]=p.value;

    return `${datos.year}-${datos.month}-${datos.day}T${datos.hour}:${datos.minute}:00`;
}


/* =========================================================
   ESTACIONES
========================================================= */

async function cargarEstaciones() {

    const [metadata,obsTemp,obsPP]=await Promise.all([
        cargarCSV("observaciones/metadata.csv"),
        cargarCSV("observaciones/obs_temp.csv"),
        cargarCSV("observaciones/obs_pp.csv")
    ]);

    const codigosDisponibles=new Set([
        ...obsTemp.map(fila=>String(fila.codigo)),
        ...obsPP.map(fila=>String(fila.codigo))
    ]);

    estaciones=metadata
        .filter(fila=>codigosDisponibles.has(String(fila.codigo)))
        .map(fila=>({
            codigo:String(fila.codigo),
            estacion:fila.estacion,
            departamento:fila.departamento,
            provincia:fila.provincia,
            latitud:parseFloat(fila.latitud),
            longitud:parseFloat(fila.longitud)
        }))
        .filter(e=>Number.isFinite(e.latitud)&&Number.isFinite(e.longitud));

    estaciones.sort(
        (a,b)=>a.estacion.localeCompare(b.estacion,"es")
    );

    cargarDepartamentos();
}


function agregarOpcionVacia(select,texto) {

    const option=document.createElement("option");

    option.value="";
    option.textContent=texto;

    select.appendChild(option);
}


function cargarDepartamentos() {

    const select=document.getElementById("departamentoSelect");

    const departamentos=[
        ...new Set(
            estaciones
                .map(e=>e.departamento)
                .filter(Boolean)
        )
    ].sort((a,b)=>a.localeCompare(b,"es"));

    select.innerHTML="";

    agregarOpcionVacia(
        select,
        "Seleccione departamento"
    );

    for(const departamento of departamentos) {

        const option=document.createElement("option");

        option.value=departamento;
        option.textContent=departamento;

        select.appendChild(option);
    }

    cargarProvincias();
}


function cargarProvincias() {

    const departamento=
        document.getElementById("departamentoSelect").value;

    const select=
        document.getElementById("provinciaSelect");

    select.innerHTML="";

    agregarOpcionVacia(
        select,
        "Seleccione provincia"
    );

    if(departamento) {

        const provincias=[
            ...new Set(
                estaciones
                    .filter(e=>e.departamento===departamento)
                    .map(e=>e.provincia)
                    .filter(Boolean)
            )
        ].sort((a,b)=>a.localeCompare(b,"es"));

        for(const provincia of provincias) {

            const option=document.createElement("option");

            option.value=provincia;
            option.textContent=provincia;

            select.appendChild(option);
        }
    }

    cargarEstacionesProvincia();
}


function cargarEstacionesProvincia() {

    const departamento=
        document.getElementById("departamentoSelect").value;

    const provincia=
        document.getElementById("provinciaSelect").value;

    const select=
        document.getElementById("estacionSelect");

    select.innerHTML="";

    agregarOpcionVacia(
        select,
        "Seleccione estación"
    );

    if(!departamento || !provincia)
        return;

    const filtradas=estaciones.filter(
        e=>e.departamento===departamento &&
           e.provincia===provincia
    );

    for(const estacion of filtradas) {

        const option=document.createElement("option");

        option.value=estacion.codigo;
        option.textContent=
            `${estacion.estacion} (${estacion.codigo})`;

        select.appendChild(option);
    }
}


/* =========================================================
   MAPA
========================================================= */

function iniciarMapa() {

    mapa=L.map(
        "mapa",
        {zoomControl:true}
    ).setView([-9.2,-75.0],5);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:18,
            attribution:"&copy; OpenStreetMap"
        }
    ).addTo(mapa);

    capaEstaciones=L.layerGroup().addTo(mapa);
}


function estiloMarcador(seleccionado=false) {

    return {
        radius:seleccionado ? 9 : 6,
        color:"#17366d",
        weight:seleccionado ? 3 : 2,
        fillColor:seleccionado ? "#f4c430" : "#ffffff",
        fillOpacity:seleccionado ? 1 : .9
    };
}


function actualizarMapa() {

    if(!mapa)
        return;

    const departamento=
        document.getElementById("departamentoSelect").value;

    const provincia=
        document.getElementById("provinciaSelect").value;

    const codigo=
        document.getElementById("estacionSelect").value;

    let filtradas=estaciones;

    if(departamento) {
        filtradas=filtradas.filter(
            e=>e.departamento===departamento
        );
    }

    if(provincia) {
        filtradas=filtradas.filter(
            e=>e.provincia===provincia
        );
    }

    capaEstaciones.clearLayers();

    marcadores={};

    const limites=[];

    for(const estacion of filtradas) {

        const marcador=L.circleMarker(
            [estacion.latitud,estacion.longitud],
            estiloMarcador(estacion.codigo===codigo)
        );

        marcador.bindTooltip(
            `${estacion.estacion} (${estacion.codigo})`,
            {direction:"top"}
        );

        marcador.bindPopup(
            `<strong>${estacion.estacion}</strong><br>
             ${estacion.provincia}, ${estacion.departamento}<br>
             Código: ${estacion.codigo}`
        );

        marcador.on(
            "click",
            async()=>{
                await seleccionarEstacionDesdeMapa(estacion);
            }
        );

        marcador.addTo(capaEstaciones);

        marcadores[estacion.codigo]=marcador;

        limites.push([
            estacion.latitud,
            estacion.longitud
        ]);
    }

    if(limites.length===1) {

        mapa.setView(
            limites[0],
            11
        );

    } else if(limites.length>1) {

        mapa.fitBounds(
            limites,
            {
                padding:[30,30],
                maxZoom:11
            }
        );
    }

    resaltarEstacion(
        codigo,
        false
    );
}


function resaltarEstacion(codigo,centrar=true) {

    for(const [id,marcador] of Object.entries(marcadores)) {

        marcador.setStyle(
            estiloMarcador(id===codigo)
        );

        if(id===codigo) {

            marcador.bringToFront();

            if(centrar)
                mapa.panTo(
                    marcador.getLatLng()
                );
        }
    }
}


async function seleccionarEstacionDesdeMapa(estacion) {

    document.getElementById(
        "departamentoSelect"
    ).value=estacion.departamento;

    cargarProvincias();

    document.getElementById(
        "provinciaSelect"
    ).value=estacion.provincia;

    cargarEstacionesProvincia();

    document.getElementById(
        "estacionSelect"
    ).value=estacion.codigo;

    actualizarMapa();

    resaltarEstacion(
        estacion.codigo,
        true
    );

    await actualizarGraficas();
}


/* =========================================================
   CICLOS Y MODELOS
========================================================= */

async function cargarManifiesto() {

    const respuesta=await fetch(
        "modelos/ciclos.json",
        {cache:"no-cache"}
    );

    if(!respuesta.ok)
        throw new Error(
            "No se pudo cargar modelos/ciclos.json"
        );

    manifiesto=await respuesta.json();
}


function modelosSeleccionados() {

    const seleccionados=[];

    document
        .querySelectorAll(".modelo-input")
        .forEach(input=>{

            if(input.checked)
                seleccionados.push(
                    input.value
                );
        });

    return seleccionados;
}


function obtenerFila(datos,codigo) {

    return datos.find(
        fila=>String(fila.codigo)===String(codigo)
    );
}


function filaASerie(fila) {

    if(!fila)
        return {x:[],y:[]};

    const columnas=Object.keys(fila)
        .filter(col=>/^\d{10}$/.test(col))
        .sort();

    const x=[];
    const y=[];

    for(const columna of columnas) {

        const valor=parseFloat(
            fila[columna]
        );

        if(
            fila[columna]==="" ||
            fila[columna]===null ||
            fila[columna]===undefined ||
            Number.isNaN(valor)
        ) {
            y.push(null);
        } else {
            y.push(valor);
        }

        x.push(
            fechaPeru(columna)
        );
    }

    return {x,y};
}


/* =========================================================
   HOVER
========================================================= */

function hoverObservado(variable) {

    const valor=
        variable==="temp"
        ? "%{y:.1f} °C"
        : "%{y:.1f} mm";

    return `<b>Observado</b>: ${valor}<extra></extra>`;
}


function hoverModelo(variable,modelo,ciclo) {

    const dia=ciclo.slice(6,8);
    const mes=ciclo.slice(4,6);
    const hora=ciclo.slice(8,10);

    const valor=
        variable==="temp"
        ? "%{y:.1f} °C"
        : "%{y:.1f} mm";

    return `<b>${MODELOS[modelo].nombre}</b> · ${dia}/${mes} ${hora} UTC: ${valor}<extra></extra>`;
}


/* =========================================================
   OBSERVACIONES
========================================================= */

async function crearTrazaObservada(variable,codigo) {

    const ruta=
        variable==="temp"
        ? "observaciones/obs_temp.csv"
        : "observaciones/obs_pp.csv";

    const datos=
        await cargarCSV(ruta);

    const fila=
        obtenerFila(datos,codigo);

    const serie=
        filaASerie(fila);

    return {
        x:serie.x,
        y:serie.y,
        type:"scatter",

        mode:
            variable==="pp"
            ? "lines+markers"
            : "lines",

        name:"Observado",

        legendgroup:"observado",
        legendrank:0,

        line:{
            color:"#111111",
            width:3
        },

        marker:{
            color:"#111111",
            size:4
        },

        connectgaps:false,

        hovertemplate:
            hoverObservado(variable)
    };
}


/* =========================================================
   PRONÓSTICOS
========================================================= */

async function crearTrazasUnModelo(
    variable,
    codigo,
    modelo,
    ciclos
) {

    const ciclosModelo=
        ciclos.filter(ciclo=>{

            const info=
                manifiesto.ciclos[ciclo];

            return (
                info[modelo] &&
                info[modelo].includes(variable)
            );
        });

    const trazas=[];

    for(
        let i=0;
        i<ciclosModelo.length;
        i++
    ) {

        const ciclo=
            ciclosModelo[i];

        const hora=
            ciclo.slice(8,10);

        const archivo=
            `modelos/${ciclo}/${modelo}_${hora}_${variable}.csv`;

        let datos;

        try {

            datos=
                await cargarCSV(archivo);

        } catch(error) {

            console.warn(error);

            continue;
        }

        const fila=
            obtenerFila(
                datos,
                codigo
            );

        if(!fila)
            continue;

        const serie=
            filaASerie(fila);

        const colores=
            MODELOS[modelo].colores;

        const indiceColor=
            ciclosModelo.length===1
            ? colores.length-2
            : Math.round(
                i*(colores.length-1)/
                (ciclosModelo.length-1)
            );

        const dia=
            ciclo.slice(6,8);

        const mes=
            ciclo.slice(4,6);

        trazas.push({

            x:serie.x,
            y:serie.y,

            type:"scatter",

            mode:
                variable==="pp"
                ? "lines+markers"
                : "lines",

            name:
                `${dia}/${mes} ${hora} UTC`,

            legendgroup:modelo,

            legendrank:
                10+
                Object.keys(MODELOS)
                    .indexOf(modelo),

            legendgrouptitle:
                i===0
                ? {
                    text:
                        MODELOS[modelo].nombre
                }
                : undefined,

            line:{
                color:
                    colores[indiceColor],
                width:1.5
            },

            marker:{
                color:
                    colores[indiceColor],
                size:3
            },

            connectgaps:false,

            hovertemplate:
                hoverModelo(
                    variable,
                    modelo,
                    ciclo
                )
        });
    }

    return trazas;
}


async function crearTrazasModelos(
    variable,
    codigo
) {

    const activos=
        modelosSeleccionados();

    const ciclos=
        Object.keys(
            manifiesto.ciclos
        ).sort();

    const grupos=
        await Promise.all(
            activos.map(
                modelo=>
                    crearTrazasUnModelo(
                        variable,
                        codigo,
                        modelo,
                        ciclos
                    )
            )
        );

    return grupos.flat();
}


/* =========================================================
   RANGO TEMPORAL
========================================================= */

function fechasValidas(traza) {

    const fechas=[];

    for(
        let i=0;
        i<traza.x.length;
        i++
    ) {

        if(
            traza.y[i]!==null &&
            traza.y[i]!==undefined &&
            !Number.isNaN(traza.y[i])
        ) {
            fechas.push(
                traza.x[i]
            );
        }
    }

    return fechas;
}


function rangoTemporal(
    trazaObs,
    trazasModelos
) {

    const obs=
        fechasValidas(
            trazaObs
        );

    const todas=[
        trazaObs,
        ...trazasModelos
    ].flatMap(
        fechasValidas
    );

    if(todas.length===0)
        return null;

    todas.sort();

    const inicio=
        obs.length>0
        ? obs[0]
        : todas[0];

    const fin=
        todas[
            todas.length-1
        ];

    return [
        inicio,
        fin
    ];
}


/* =========================================================
   PLOTLY
========================================================= */

function crearLayout(
    titulo,
    unidad,
    rango
) {

    const xaxis={

        title:{
            text:"Fecha"
        },

        type:"date",

        tickformat:"%d/%m",

        hoverformat:
            "%d/%m/%Y %H:%M",

        showgrid:true,

        gridcolor:"#edf0f4",

        linecolor:"#8492a6",

        zeroline:false,

        showspikes:true,

        spikemode:"across",

        spikesnap:"cursor",

        spikedash:"dot",

        spikecolor:"#90a4ae",

        rangeslider:{
            visible:false
        }
    };

    if(rango) {

        xaxis.range=rango;

        xaxis.minallowed=
            rango[0];

        xaxis.maxallowed=
            rango[1];
    }

    return {

        title:{
            text:titulo,
            x:.5,
            xanchor:"center",
            font:{
                size:17,
                color:"#10254d"
            }
        },

        margin:{
            l:70,
            r:30,
            t:70,
            b:260
        },

        paper_bgcolor:"white",

        plot_bgcolor:"white",

        font:{
            family:
                "Arial, Helvetica, sans-serif",
            color:"#263238"
        },

        hovermode:"x unified",

        hoverdistance:60,

        spikedistance:-1,

        hoverlabel:{
            bgcolor:"white",
            bordercolor:"#aeb9c8",
            font:{
                size:12,
                family:
                    "Arial, Helvetica, sans-serif"
            },
            align:"left"
        },

        xaxis:xaxis,

        yaxis:{
            title:{
                text:unidad
            },

            showgrid:true,

            gridcolor:"#e4e8ed",

            linecolor:"#8492a6",

            zeroline:false
        },

        legend:{

            title:{
                text:
                    "Inicialización del pronóstico (UTC)",
                font:{
                    size:11,
                    color:"#10254d"
                }
            },

            orientation:"h",

            x:.5,

            xanchor:"center",

            y:-.28,

            yanchor:"top",

            traceorder:"grouped",

            tracegroupgap:18,

            groupclick:"toggleitem",

            bgcolor:
                "rgba(248,250,252,0.98)",

            bordercolor:"#d8dee8",

            borderwidth:1,

            font:{
                size:10
            },

            itemsizing:"constant"
        },

        showlegend:true
    };
}


const CONFIG_PLOTLY={
    responsive:true,
    displaylogo:false,
    scrollZoom:true
};


/* =========================================================
   MENSAJES SIN ESTACIÓN
========================================================= */

function mostrarSinEstacion() {

    document.getElementById(
        "informacion"
    ).textContent=
        "Seleccione una estación en el mapa o mediante los filtros para visualizar los pronósticos y observaciones.";

    Plotly.purge(
        "graficaTemperatura"
    );

    Plotly.purge(
        "graficaPrecipitacion"
    );

    document.getElementById(
        "graficaTemperatura"
    ).innerHTML=
        '<div class="mensaje-grafica">Seleccione una estación para visualizar la temperatura.</div>';

    document.getElementById(
        "graficaPrecipitacion"
    ).innerHTML=
        '<div class="mensaje-grafica">Seleccione una estación para visualizar la precipitación.</div>';
}


/* =========================================================
   ACTUALIZACIÓN
========================================================= */

async function actualizarGraficas() {

    const codigo=
        document.getElementById(
            "estacionSelect"
        ).value;

    if(!codigo) {

        mostrarSinEstacion();

        return;
    }

    const estacion=
        estaciones.find(
            e=>
                String(e.codigo)===
                String(codigo)
        );

    if(!estacion)
        return;

    document.getElementById(
        "informacion"
    ).textContent=
        `${estacion.estacion} (${estacion.codigo}) | ${estacion.provincia}, ${estacion.departamento} | Hora mostrada: Perú (UTC-5) | Pase el cursor sobre la gráfica para comparar los pronósticos disponibles`;

    try {

        const [
            obsTemp,
            modelosTemp,
            obsPP,
            modelosPP
        ]=await Promise.all([

            crearTrazaObservada(
                "temp",
                codigo
            ),

            crearTrazasModelos(
                "temp",
                codigo
            ),

            crearTrazaObservada(
                "pp",
                codigo
            ),

            crearTrazasModelos(
                "pp",
                codigo
            )
        ]);

        const rangoTemp=
            rangoTemporal(
                obsTemp,
                modelosTemp
            );

        const rangoPP=
            rangoTemporal(
                obsPP,
                modelosPP
            );

        const layoutTemp=
            crearLayout(
                "Temperatura del aire a 2 m",
                "Temperatura (°C)",
                rangoTemp
            );

        const layoutPP=
            crearLayout(
                "Precipitación acumulada cada 6 horas",
                "Precipitación (mm / 6 h)",
                rangoPP
            );

        layoutPP.yaxis.rangemode=
            "tozero";

        await Promise.all([

            Plotly.react(
                "graficaTemperatura",
                [
                    ...modelosTemp,
                    obsTemp
                ],
                layoutTemp,
                CONFIG_PLOTLY
            ),

            Plotly.react(
                "graficaPrecipitacion",
                [
                    ...modelosPP,
                    obsPP
                ],
                layoutPP,
                CONFIG_PLOTLY
            )
        ]);

    } catch(error) {

        console.error(error);

        document.getElementById(
            "informacion"
        ).textContent=
            `Error cargando datos: ${error.message}`;
    }
}
